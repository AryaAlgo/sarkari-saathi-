<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sarkari Saathi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,400;0,700;1,400&family=Lora:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --teal:#0b3c49; --teal2:#134f5f; --orange:#f28c28; --green:#207b4f;
    --rust:#c8553d; --mist:#eef2f1; --ink:#1b2a2f; --gold:#e8c26a;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:Lato,system-ui,sans-serif;color:var(--ink);background:#fff;line-height:1.5}
  header{background:var(--teal);color:#fff;padding:28px 20px 36px;text-align:center}
  header h1{font-family:Lora,Georgia,serif;font-size:2.2rem;margin:0 0 6px}
  header p{margin:0;color:#d5e4e8;max-width:560px;margin-inline:auto}
  main{max-width:860px;margin:-22px auto 40px;padding:0 16px}
  .panel{background:#fff;border-radius:18px;box-shadow:0 6px 28px rgba(11,60,73,.14);padding:22px}
  .controls{display:flex;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap;margin-bottom:6px}
  select{padding:9px 12px;border-radius:10px;border:1px solid #c7d3d6;font:inherit;background:#fff}
  #mic{width:104px;height:104px;border-radius:50%;border:0;background:var(--orange);color:#fff;cursor:pointer;
       display:grid;place-items:center;box-shadow:0 6px 18px rgba(242,140,40,.45);transition:transform .15s}
  #mic:hover{transform:scale(1.04)}
  #mic svg{width:46px;height:46px;fill:#fff}
  #mic.rec{background:var(--rust);animation:pulse 1.2s infinite}
  #mic:disabled{opacity:.6;cursor:wait}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(200,85,61,.55)}100%{box-shadow:0 0 0 24px rgba(200,85,61,0)}}
  .center{text-align:center}
  #status{min-height:24px;color:var(--teal2);font-weight:700;margin:10px 0 4px}
  .or{color:#7a8b90;font-size:.9rem;margin:10px 0}
  form{display:flex;gap:8px}
  form input{flex:1;padding:12px 14px;border:1px solid #c7d3d6;border-radius:10px;font:inherit}
  form button{padding:12px 18px;border:0;border-radius:10px;background:var(--teal);color:#fff;font:inherit;font-weight:700;cursor:pointer}
  .chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:12px}
  .chip{background:var(--mist);border:0;border-radius:999px;padding:7px 14px;font:inherit;font-size:.9rem;cursor:pointer;color:var(--teal)}
  .chip:hover{background:#dfe8e6}
  .bubble{border-radius:14px;padding:14px 16px;margin:18px 0 0}
  .you{background:var(--orange);color:#1b1b1b}
  .bot{background:var(--teal);color:#fff}
  .bubble small{display:block;font-weight:700;margin-bottom:2px;opacity:.85}
  .bot .replay{margin-top:10px;background:rgba(255,255,255,.16);color:#fff;border:0;border-radius:8px;padding:6px 12px;cursor:pointer;font:inherit}
  h2{font-family:Lora,Georgia,serif;color:var(--teal);margin:26px 0 10px}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
  .card{background:var(--mist);border-radius:14px;padding:16px}
  .card h3{margin:0 0 2px;color:var(--teal);font-size:1.05rem}
  .card .hi{color:var(--green);font-weight:700;font-size:.9rem;margin-bottom:6px}
  .card p{margin:6px 0;font-size:.92rem}
  .card .benefit{font-weight:700}
  details summary{cursor:pointer;color:var(--rust);font-weight:700;font-size:.9rem;margin-top:6px}
  .checklist{list-style:none;padding:0;margin:0;display:grid;gap:8px}
  .checklist li{display:flex;gap:10px;align-items:center;background:#fff;border:1px solid #d5e0e0;border-radius:10px;padding:10px 12px}
  .checklist input{width:20px;height:20px;accent-color:var(--green)}
  .checklist input:checked + span{text-decoration:line-through;color:#7a8b90}
  .disclaimer{font-style:italic;color:var(--teal2);font-size:.88rem;margin-top:22px;text-align:center}
  .error{background:#fdeceb;color:#9c2b1c;border-radius:10px;padding:12px 14px;margin-top:14px}
  .hidden{display:none}
</style>
</head>
<body>
<header>
  <h1>Sarkari Saathi</h1>
  <p>Tell us your situation by voice. We'll find the government schemes you may qualify for, in your own language.</p>
</header>

<main>
  <section class="panel">
    <div class="controls">
      <label for="lang">Language</label>
      <select id="lang">
        <option value="">Auto-detect</option>
        <option value="hi-IN">हिन्दी (Hindi)</option>
        <option value="en-IN">English</option>
        <option value="bn-IN">বাংলা (Bengali)</option>
        <option value="mr-IN">मराठी (Marathi)</option>
        <option value="gu-IN">ગુજરાતી (Gujarati)</option>
        <option value="pa-IN">ਪੰਜਾਬੀ (Punjabi)</option>
        <option value="ta-IN">தமிழ் (Tamil)</option>
        <option value="te-IN">తెలుగు (Telugu)</option>
        <option value="kn-IN">ಕನ್ನಡ (Kannada)</option>
        <option value="ml-IN">മലയാളം (Malayalam)</option>
        <option value="od-IN">ଓଡ଼ିଆ (Odia)</option>
      </select>
    </div>

    <div class="center">
      <button id="mic" aria-label="Tap to speak">
        <svg viewBox="0 0 24 24"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2z"/></svg>
      </button>
      <div id="status">Tap the mic and describe your situation</div>
    </div>

    <div class="or center">or type it</div>
    <form id="textForm">
      <input id="textInput" placeholder="e.g. I am a farmer in Pratapgarh with 2 acres. My daughter is in class 10." autocomplete="off">
      <button type="submit">Ask</button>
    </form>
    <div class="chips" id="chips"></div>

    <div id="error" class="error hidden"></div>
    <div id="result" class="hidden"></div>
  </section>
  <p class="disclaimer">Guidance only. Final eligibility is confirmed on the official portals or at your nearest CSC centre.</p>
</main>

<script>
const $ = (id) => document.getElementById(id);
const mic = $("mic"), statusEl = $("status"), errEl = $("error"), resEl = $("result");
let recorder = null, chunks = [], stream = null, player = null, lastAudios = null, lastText = "";

const EXAMPLES = [
  "मैं प्रतापगढ़ में किसान हूँ, मेरे पास 2 एकड़ ज़मीन है और बेटी दसवीं में है",
  "I am a widow aged 65 with no house in a village",
  "मेरी पत्नी गर्भवती है, हम गरीब परिवार से हैं",
  "I run a small tea shop and need a loan"
];
EXAMPLES.forEach(t => {
  const b = document.createElement("button");
  b.className = "chip"; b.type = "button"; b.textContent = t;
  b.onclick = () => { $("textInput").value = t; submitText(t); };
  $("chips").appendChild(b);
});

function setStatus(t){ statusEl.textContent = t; }
function showError(m){ errEl.textContent = m; errEl.classList.remove("hidden"); }
function clearError(){ errEl.classList.add("hidden"); }

/* ---------- recording ---------- */
mic.onclick = async () => {
  if (recorder && recorder.state === "recording") { recorder.stop(); return; }
  clearError(); stopAudio();
  try {
    stream = await navigator.mediaDevices.getUserMedia({ audio: true });
  } catch (e) {
    showError("Microphone permission is needed. Please allow it, or type your question instead.");
    return;
  }
  const mime = ["audio/webm;codecs=opus","audio/webm","audio/ogg;codecs=opus","audio/mp4"]
    .find(m => window.MediaRecorder && MediaRecorder.isTypeSupported(m)) || "";
  recorder = new MediaRecorder(stream, mime ? { mimeType: mime } : undefined);
  chunks = [];
  recorder.ondataavailable = e => e.data.size && chunks.push(e.data);
  recorder.onstop = async () => {
    stream.getTracks().forEach(t => t.stop());
    mic.classList.remove("rec");
    const blob = new Blob(chunks, { type: recorder.mimeType || "audio/webm" });
    await send({ audio: blob });
  };
  recorder.start();
  mic.classList.add("rec");
  setStatus("Listening… tap again when you finish");
};

$("textForm").onsubmit = (e) => { e.preventDefault(); submitText($("textInput").value); };
function submitText(t){ t = t.trim(); if (t) { clearError(); stopAudio(); send({ text: t }); } }

/* ---------- convert recording to 16 kHz mono WAV (Sarvam rejects webm) ---------- */
async function toWav(blob) {
  const AC = window.AudioContext || window.webkitAudioContext;
  const ctx = new AC();
  const decoded = await ctx.decodeAudioData(await blob.arrayBuffer());
  ctx.close && ctx.close();
  const rate = 16000;
  const frames = Math.ceil(decoded.duration * rate);
  const off = new OfflineAudioContext(1, frames, rate);   // mixes down to mono and resamples
  const src = off.createBufferSource();
  src.buffer = decoded; src.connect(off.destination); src.start();
  const pcm = (await off.startRendering()).getChannelData(0);
  const buf = new ArrayBuffer(44 + pcm.length * 2);
  const v = new DataView(buf);
  const w = (o, s) => [...s].forEach((c, i) => v.setUint8(o + i, c.charCodeAt(0)));
  w(0, "RIFF"); v.setUint32(4, 36 + pcm.length * 2, true); w(8, "WAVE"); w(12, "fmt ");
  v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
  v.setUint32(24, rate, true); v.setUint32(28, rate * 2, true); v.setUint16(32, 2, true);
  v.setUint16(34, 16, true); w(36, "data"); v.setUint32(40, pcm.length * 2, true);
  for (let i = 0; i < pcm.length; i++) {
    const s = Math.max(-1, Math.min(1, pcm[i]));
    v.setInt16(44 + i * 2, s < 0 ? s * 0x8000 : s * 0x7fff, true);
  }
  return new Blob([buf], { type: "audio/wav" });
}

/* ---------- API ---------- */
async function send({ audio, text }) {
  mic.disabled = true; setStatus("Understanding and finding schemes…");
  const fd = new FormData();
  if (audio) {
    try {
      fd.append("audio", await toWav(audio), "voice.wav");
    } catch (e) {
      showError("Could not read the recording in this browser. Please type your question instead.");
      setStatus("Tap the mic and describe your situation"); mic.disabled = false; return;
    }
  }
  if (text) fd.append("text", text);
  fd.append("language", $("lang").value);
  try {
    const r = await fetch("/api/ask", { method: "POST", body: fd });
    const j = await r.json();
    if (!r.ok) throw new Error(j.detail || "Something went wrong");
    render(j);
    setStatus("Tap the mic to ask again");
    playReply(j);
  } catch (e) {
    showError(e.message); setStatus("Tap the mic and describe your situation");
  } finally { mic.disabled = false; }
}

/* ---------- audio playback ---------- */
function stopAudio(){ if (player) { player.pause(); player = null; } speechSynthesis && speechSynthesis.cancel(); }
function playReply(j){
  lastAudios = j.audios; lastText = `${j.answer} ${j.followup || ""}`;
  if (j.audios && j.audios.length) {
    let i = 0;
    const next = () => {
      if (i >= j.audios.length) return;
      player = new Audio("data:audio/wav;base64," + j.audios[i++]);
      player.onended = next;
      player.play().catch(() => {});
    };
    next();
  } else if ("speechSynthesis" in window) {
    const u = new SpeechSynthesisUtterance(lastText);
    u.lang = j.language || "hi-IN"; speechSynthesis.speak(u);
  }
}

/* ---------- render ---------- */
const esc = (s) => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function render(j) {
  const cards = j.schemes.map(s => `
    <div class="card">
      <h3>${esc(s.name)}</h3>
      <div class="hi">${esc(s.name_hi)}</div>
      <p>${esc(s.summary)}</p>
      <p class="benefit">${esc(s.benefit)}</p>
      <details><summary>Eligibility and how to apply</summary>
        <p><b>Who can apply:</b> ${esc(s.eligibility)}</p>
        <p><b>How to apply:</b> ${esc(s.how_to_apply)}</p>
      </details>
    </div>`).join("");
  const docs = j.documents.map((d, i) =>
    `<li><input type="checkbox" id="d${i}"><span>${esc(d)}</span></li>`).join("");
  resEl.innerHTML = `
    <div class="bubble you"><small>You said</small>${esc(j.transcript)}</div>
    <div class="bubble bot"><small>Sarkari Saathi</small>${esc(j.answer)}${j.followup ? "<br><br><i>" + esc(j.followup) + "</i>" : ""}
      <br><button class="replay" id="replay">🔊 Listen again</button></div>
    <h2>Your matches</h2><div class="cards">${cards}</div>
    <h2>Documents to carry</h2><ul class="checklist">${docs}</ul>`;
  resEl.classList.remove("hidden");
  $("replay").onclick = () => { stopAudio(); playReply(j); };
  resEl.scrollIntoView({ behavior: "smooth", block: "start" });
}
</script>
</body>
</html>
